# STUB. Owned by Jana from here on.
# Adeeb's only requirement is that this file exists and is valid,
# so the container starts. Jana replaces the scrape_configs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

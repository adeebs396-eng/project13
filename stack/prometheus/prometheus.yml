# Owned by Jana. Adeeb only guarantees the file exists and the paths are right.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Uncomment together with: COMPOSE_PROFILES=database docker compose up -d
  # Leaving this on while the profile is off makes InstanceDown fire forever.
  # - job_name: postgres_exporter
  #   static_configs:
  #     - targets: ["postgres_exporter:9187"]
